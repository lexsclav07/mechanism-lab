<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mechanism Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
  /* Layout: a textbook figure you can play with. The drawing fills the page; the controls sit
     on it in thin-ruled boxes like a figure's annotations. Top: title, given values, play
     controls. Bottom: the parts tray. Right: the card for the tapped part.
     One deliberate light look, matching the reference: black ink on white, grey parts. */
  :root {
    --paper: #ffffff; --ink: #161616; --ink-2: #6a6a6a; --rule: #d6d6d3; --soft: #f3f3f1;
    --accent: #1f4fd6;
    --grid: #f1f1ef; --grid-major: #e4e4e1;
    --f-grey: #cdcfd0; --f-light: #e8e9e9; --f-white: #ffffff; --f-dark: #8c9094; --f-ink: #161616;
    --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
    --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
    --lift: 0 1px 2px rgb(0 0 0 / .05), 0 4px 14px rgb(0 0 0 / .05);
    --gl: max(16px, env(safe-area-inset-left, 0px));
    --gr: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: light;
  }
  html { box-sizing: border-box; height: 100%; }
  body { margin: 0; }
  [hidden] { display: none !important; }
  body { height: 100%; background: var(--paper); color: var(--ink); font: 14px/1.4 var(--font-ui); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .math, i.m { font-family: var(--font-math); font-style: italic; }

  .game { position: relative; height: 100%; }
  #stage-canvas { position: absolute; inset: 0; display: block; touch-action: none; }

  /* HUD: a column laid over the drawing. It ignores the pointer except on its boxes. */
  .hud {
    position: absolute; inset: 0; box-sizing: border-box; pointer-events: none;
    display: flex; flex-direction: column; gap: 10px;
    padding-left: var(--gl); padding-right: var(--gr);
    padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .box { pointer-events: auto; background: var(--paper); border: 1px solid var(--ink); border-radius: 4px; box-shadow: var(--lift); }

  /* top: title and given values on the left, controls on the right */
  .topbar { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px; }
  .title { margin-right: auto; display: grid; gap: 6px; pointer-events: none; }
  .title h1 { margin: 0; font: italic 500 26px/1 var(--font-math); letter-spacing: -.005em; }
  .title h1 small { font: 400 12px var(--font-ui); font-style: normal; color: var(--ink-2); letter-spacing: .02em; margin-left: 8px; }
  .given { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 15px var(--font-math); }
  .given output { font-variant-numeric: tabular-nums; }
  .follow-chip { pointer-events: auto; justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; font-size: 12.5px; background: var(--paper); }
  .follow-chip button { border: 0; background: transparent; color: inherit; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
  .follow-chip button:hover { background: var(--soft); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .group { position: relative; display: flex; align-items: center; gap: 2px; padding: 3px; }
  .ib { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 3px; background: transparent; }
  .ib svg { width: 20px; height: 20px; }
  .ib:hover:not(:disabled), .tb:hover { background: var(--soft); }
  .ib:disabled { opacity: .28; cursor: default; }
  .ib[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .play { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px 0 12px; border: 0; border-radius: 3px; background: var(--ink); color: var(--paper); font-weight: 600; }
  .play:hover { background: #333; }
  .play svg { width: 15px; height: 15px; fill: currentColor; }
  .tb { height: 36px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .tb svg { width: 14px; height: 14px; }
  .tb i { font: italic 16px var(--font-math); }

  /* menus */
  .pop { position: absolute; z-index: 10; top: calc(100% + 6px); right: -1px; width: 290px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 6px; display: grid; gap: 2px; }
  .pick { display: grid; text-align: left; border: 0; border-radius: 3px; background: transparent; padding: 7px 10px; }
  .pick:hover { background: var(--soft); }
  .pick b { font: italic 500 16px var(--font-math); }
  .pick small { color: var(--ink-2); font-size: 12.5px; }
  .planets { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .planet { display: grid; text-align: left; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); }
  .planet small { font: 12px var(--font-num); color: var(--ink-2); }
  .planet[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
  .pop hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
  .pop .switch { padding: 6px 6px; }
  .pop .tb { justify-content: flex-start; }

  /* the middle row: the part card on the right */
  .middle { flex: 1; min-height: 0; display: flex; justify-content: flex-end; align-items: flex-start; pointer-events: none; }
  .inspector { width: 300px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 12px 14px 14px; display: grid; gap: 12px; align-content: start; }
  .insp-head { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  .insp-head h2 { margin: 0; flex: 1; font: 600 15px/1.2 var(--font-ui); }
  .insp-head h2 .math { font-size: 19px; font-weight: 400; margin-left: 4px; }
  .insp-head h2 sub { font-size: .65em; }
  .ib.small { width: 28px; height: 28px; }
  .ib.small svg { width: 16px; height: 16px; }
  .note { margin: 0; font-size: 12.5px; color: var(--ink-2); }
  .field { display: grid; gap: 3px; min-width: 0; }
  .f-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .f-top label, .f-label { font-size: 13px; font-weight: 500; }
  .f-num { display: inline-flex; align-items: baseline; gap: 4px; }
  .f-num input { width: 78px; box-sizing: border-box; height: 26px; padding: 0 6px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper); text-align: right; font: 13px var(--font-num); font-variant-numeric: tabular-nums; }
  .f-num input:hover { border-color: var(--ink-2); }
  .f-num input:disabled { color: var(--ink-2); background: var(--soft); }
  .unit { font: 12px var(--font-num); color: var(--ink-2); min-width: 2.5em; }
  .ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
  input[type="range"] { width: 100%; margin: 2px 0 0; accent-color: var(--ink); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pair .f-num input { width: 62px; }
  .pair .f-top { flex-wrap: wrap; }
  .switch { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .switch input { appearance: none; width: 34px; height: 18px; border-radius: 9px; border: 1px solid var(--ink); background: var(--paper); position: relative; margin: 0; flex: none; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
  .switch input:checked { background: var(--ink); }
  .switch input:checked::after { background: var(--paper); transform: translateX(16px); }
  .seg { display: flex; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .seg button { flex: 1; height: 28px; border: 0; border-right: 1px solid var(--ink); background: var(--paper); font-size: 12.5px; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .swatches { display: flex; gap: 8px; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--ink); padding: 0; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw[data-f="grey"] { background: var(--f-grey); } .sw[data-f="light"] { background: var(--f-light); }
  .sw[data-f="white"] { background: var(--f-white); } .sw[data-f="dark"] { background: var(--f-dark); }
  .sw[data-f="ink"] { background: var(--f-ink); }
  .live { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--rule); }
  .live h3 { margin: 0 0 2px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
  .stat { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .stat output { font: 13px var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
  .btn { height: 30px; padding: 0 12px; border: 1px solid var(--ink); border-radius: 3px; background: var(--paper); font-size: 13px; font-weight: 500; }
  .btn:hover { background: var(--soft); }
  .btn.remove { justify-self: start; border-color: var(--rule); color: var(--ink-2); }
  .btn.remove:hover { color: var(--ink); border-color: var(--ink); }

  /* hint and parts tray */
  .toast { align-self: center; max-width: min(600px, 100%); box-sizing: border-box; padding: 7px 14px; border-radius: 3px; background: var(--ink); color: var(--paper); font-size: 13px; text-align: center; transition: opacity .3s; pointer-events: none; }
  .toast:empty { opacity: 0; }
  .tray { align-self: center; max-width: 100%; box-sizing: border-box; display: flex; padding: 4px; overflow-x: auto; scrollbar-width: thin; }
  .tgroup { display: grid; grid-template-rows: auto auto; flex: none; padding: 0 4px; }
  .tgroup + .tgroup { border-left: 1px solid var(--rule); }
  .tgroup > span { font-size: 9.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); padding: 1px 4px 2px; }
  .tgroup > div { display: flex; gap: 1px; }
  .tool { flex: none; width: 54px; height: 54px; display: grid; place-items: center; align-content: center; gap: 2px; border: 0; border-radius: 3px; background: transparent; touch-action: pan-x; user-select: none; -webkit-user-select: none; }
  .tool svg { width: 26px; height: 26px; overflow: visible; }
  .tool span { font-size: 11px; font-weight: 500; }
  .tool:hover { background: var(--soft); }
  .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ghost { position: fixed; z-index: 20; width: 48px; height: 48px; margin: -24px 0 0 -24px; display: grid; place-items: center; border: 1px solid var(--ink); border-radius: 4px; background: var(--paper); box-shadow: var(--lift); pointer-events: none; }
  .ghost svg { width: 28px; height: 28px; overflow: visible; }
  .ghost span { display: none; }

  /* save / load */
  dialog { border: 1px solid var(--ink); border-radius: 4px; box-shadow: var(--lift); background: var(--paper); color: var(--ink); padding: 0; width: min(540px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(22 22 22 / .3); }
  .dlg { display: grid; gap: 10px; padding: 18px; }
  .dlg h2 { margin: 0; font: italic 500 22px/1.1 var(--font-math); }
  .dlg p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 60ch; }
  .dlg textarea { width: 100%; box-sizing: border-box; height: 160px; font: 12px/1.4 var(--font-num); border: 1px solid var(--rule); border-radius: 3px; background: var(--soft); padding: 8px; resize: vertical; }
  .dlg .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .dlg .grow { flex: 1; }
  #scene-msg { min-height: 1.2em; font-size: 13px; color: var(--accent); }

  @media (max-width: 760px) {
    .title h1 { font-size: 21px; }
    .title h1 small { display: none; }
    .given { font-size: 13.5px; gap: 2px 12px; }
    .middle { align-items: flex-end; }
    .inspector { width: 100%; max-height: 44vh; }
    .tool { width: 50px; height: 50px; }
    .tgroup > span { display: none; }
  }
  @media (max-width: 560px) {
    .title h1 { display: none; }
    .controls { width: 100%; justify-content: space-between; gap: 4px; }
    .group { padding: 2px; }
    .ib { width: 32px; height: 34px; }
    .play { padding: 0 10px; height: 34px; }
    #play-label, .tb .lbl, #gravity-label { display: none; }
    .tb { padding: 0 8px; height: 34px; }
    .title { order: 2; }
  }
  @media (prefers-reduced-motion: reduce) { .toast, .switch input::after { transition: none; } }
</style>

</head>
<body>
<div class="game">
  <canvas id="stage-canvas" aria-label="The drawing. Build with parts from the tray, then press Play."></canvas>

  <div class="hud">
    <header class="topbar">
      <div class="title">
        <h1>Mechanism Lab<small>2D · SI units</small></h1>
        <div class="given" aria-label="This run">
          <span><i class="m">t</i> = <output id="st-time">0.0 s</output></span>
          <span><i class="m">v</i><sub>max</sub> = <output id="st-speed">0.00 m/s</output></span>
          <span><i class="m">F</i><sub>max</sub> = <output id="st-force">0 N</output></span>
        </div>
        <div class="follow-chip" id="follow-chip" hidden>
          <span id="follow-label">Camera following</span>
          <button type="button" id="follow-stop" aria-label="Stop following">
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="controls">
        <div class="group box">
          <button class="play" id="play" type="button" aria-pressed="false" title="Play or pause (Space)">
            <svg viewBox="0 0 24 24" id="play-icon" aria-hidden="true"><path d="M6 4v16l14-8z"/></svg><span id="play-label">Play</span>
          </button>
          <button class="ib" id="reset" type="button" aria-label="Reset" title="Back to where you pressed Play (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4.5H9"/></svg>
          </button>
          <button class="ib" id="slowmo" type="button" aria-pressed="false" aria-label="Slow motion" title="Slow motion, quarter speed (S)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15c0-4 3.5-7 8-7s7 3 7 6v1H3z"/><path d="M18 13h2a1.5 1.5 0 0 0 0-3h-1"/><path d="M6 15v3M14 15v3"/></svg>
          </button>
        </div>
        <div class="group box">
          <button class="ib" id="undo" type="button" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          </button>
          <button class="ib" id="redo" type="button" aria-label="Redo" title="Redo (Ctrl+Y)" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          </button>
        </div>
        <div class="group box">
          <button class="tb" id="examples-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="examples-pop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span class="lbl">Examples</span>
          </button>
          <button class="tb" id="gravity-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="gravity-pop" title="Gravity">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v16M6 13l6 6 6-6"/></svg><i>g</i><span id="gravity-label">Earth</span>
          </button>
          <button class="ib" id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-pop" aria-label="More">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </button>
          <div class="pop box" id="examples-pop" hidden></div>
          <div class="pop box" id="gravity-pop" hidden></div>
          <div class="pop box" id="menu-pop" hidden></div>
        </div>
      </div>
    </header>

    <div class="middle">
      <aside class="inspector box" id="inspector" aria-label="Selected part" hidden></aside>
    </div>

    <div class="toast" id="hint" role="status"></div>

    <nav class="tray box" aria-label="Parts">
      <div class="tgroup"><span>Move</span><div>
        <button class="tool" type="button" data-tool="select" title="Move and grab (1)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 18.5 12l-5.4 1.3-2.9 5.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Grab</span></button>
        <button class="tool" type="button" data-tool="camera" title="Camera follow (2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg><span>Follow</span></button>
      </div></div>
      <div class="tgroup"><span>Bodies</span><div>
        <button class="tool" type="button" data-tool="box" title="Block (3): drag it onto the drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" style="fill:var(--f-grey)" stroke="currentColor" stroke-width="1.5"/></svg><span>Block</span></button>
        <button class="tool" type="button" data-tool="weight" title="Weight (4): drag it onto the drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="currentColor"/></svg><span>Weight</span></button>
        <button class="tool" type="button" data-tool="poly" title="Shape (5)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18.5 8.5 5l11 4.5L16.5 19z" style="fill:var(--f-grey)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Shape</span></button>
      </div></div>
      <div class="tgroup"><span>Joints</span><div>
        <button class="tool" type="button" data-tool="pivot" title="Pin (6): drag it onto a part">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5.5" style="fill:var(--paper)" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg><span>Pin</span></button>
        <button class="tool" type="button" data-tool="motor" title="Motor (7): drag it onto a part">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="3.6" style="fill:var(--paper)"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><path d="M19.5 12A7.5 7.5 0 1 1 15.5 5.4"/><path d="M15.2 2.8l.6 2.9-2.9.5" stroke-linejoin="round"/></svg><span>Motor</span></button>
        <button class="tool" type="button" data-tool="weld" title="Glue (8): drag it where two parts overlap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="11" height="8.5" style="fill:var(--f-light)" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10.5" width="11" height="8.5" style="fill:var(--f-grey)" stroke="currentColor" stroke-width="1.4"/><path d="M12 9.6l2.4 2.4-2.4 2.4-2.4-2.4z" fill="currentColor"/></svg><span>Glue</span></button>
        <button class="tool" type="button" data-tool="slider" title="Track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12.5h22" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 1.6 1.2 1.6"/><rect x="7.5" y="8" width="9" height="9" style="fill:var(--f-grey)" stroke="currentColor" stroke-width="1.4"/></svg><span>Track</span></button>
      </div></div>
      <div class="tgroup"><span>Links</span><div>
        <button class="tool" type="button" data-tool="rod" title="Rod (9)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18 18 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="6" cy="18" r="2.6" style="fill:var(--paper)" stroke="currentColor" stroke-width="1.3"/><circle cx="18" cy="6" r="2.6" style="fill:var(--paper)" stroke="currentColor" stroke-width="1.3"/></svg><span>Rod</span></button>
        <button class="tool" type="button" data-tool="rope" title="Rope (0)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c3 12 13 12 16 0" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="7" r="1.8" fill="currentColor"/><circle cx="20" cy="7" r="1.8" fill="currentColor"/></svg><span>Rope</span></button>
        <button class="tool" type="button" data-tool="pulley" title="Pulley: tap the wheel, then both ends">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 9V2.5M8 2.5h8"/><circle cx="12" cy="11" r="5" style="fill:var(--f-grey)"/><circle cx="12" cy="11" r="1.2" fill="currentColor"/><path d="M7 11v10M17 11v6"/><rect x="5" y="20" width="4" height="3" fill="currentColor" stroke="none"/><rect x="15" y="16.5" width="4" height="3" fill="currentColor" stroke="none"/></svg><span>Pulley</span></button>
      </div></div>
      <div class="tgroup"><span>Forces</span><div>
        <button class="tool" type="button" data-tool="spring" title="Spring">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12h3c0-4.5 3.2-4.5 3 0s-2 4.5-2 0 3.2-4.5 3 0-2 4.5-2 0 3.2-4.5 3 0-2 4.5-2 0 3.2-4.5 3 0-2 4.5-2 0 3.2-4.5 3 0h5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span>Spring</span></button>
        <button class="tool" type="button" data-tool="damper" title="Damper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="7" y="8" width="7" height="8" style="fill:var(--f-light)" stroke="none"/><path d="M1 12h6M15 7.5H7v9h8M23 12h-9M11 8.6v6.8"/></svg><span>Damper</span></button>
        <button class="tool" type="button" data-tool="piston" title="Piston">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M1 12h3" stroke-width="2.4"/><rect x="4" y="8.5" width="10" height="7" style="fill:var(--f-grey)" stroke-width="1.3"/><path d="M11 12h12" stroke-width="2.8"/><path d="M11 9.5v5" stroke-width="2"/></svg><span>Piston</span></button>
      </div></div>
      <div class="tgroup"><span>&nbsp;</span><div>
        <button class="tool" type="button" data-tool="erase" title="Eraser">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(-40 12 12)"><rect x="3" y="8" width="18" height="8" rx="1" style="fill:var(--paper)" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="8" width="7" height="8" rx="1" style="fill:var(--f-dark)" stroke="currentColor" stroke-width="1.4"/></g></svg><span>Erase</span></button>
      </div></div>
    </nav>
  </div>
</div>

<dialog id="scene-dialog" aria-labelledby="scene-title">
  <div class="dlg">
    <h2 id="scene-title">Save or load a build</h2>
    <p>Your build saves itself in this browser. To keep a copy or share it, copy this text somewhere safe. To load one, paste its text here.</p>
    <textarea id="scene-json" spellcheck="false" aria-label="Build as text"></textarea>
    <div id="scene-msg" role="status"></div>
    <div class="row">
      <button class="btn" id="scene-copy" type="button">Copy text</button>
      <button class="btn" id="scene-load" type="button">Load pasted text</button>
      <span class="grow"></span>
      <button class="btn" id="scene-close" type="button">Close</button>
    </div>
  </div>
</dialog>
